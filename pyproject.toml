[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esnfed"
dynamic = ["version"]
description = "Echo State Networks for Federated Learning: reservoirs, topologies and federated strategies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dairon Andres Benites Aldaz", email = "dairon.aldaz@gmail.com" },
]
keywords = [
    "echo state networks",
    "reservoir computing",
    "federated learning",
    "recurrent neural networks",
    "ensemble learning",
    "time series",
    "machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core runtime dependencies: the library itself only needs these two.
dependencies = [
    "numpy>=1.21",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Everything needed to reproduce the experiments (figures, tables, CSVs).
experiments = [
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]
# Visualisation: plotly (default backend), matplotlib + seaborn, kaleido (static export).
viz = [
    "plotly>=5.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "kaleido",
]
# Interoperability with ReservoirPy (design reservoirs there, federate here).
reservoirpy = [
    "reservoirpy>=0.3",
]
# Integration with the Flower federated-learning framework.
flower = [
    "flwr>=1.7",
]
# Documentation site (MkDocs Material).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
]
# Experimental FedResPrompt LLM orchestration (optional real-LLM backend).
llm = [
    "transformers>=4.30",
]
# Development tooling.
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/daibeal/tfg-inf"
Repository = "https://github.com/daibeal/tfg-inf"
Issues = "https://github.com/daibeal/tfg-inf/issues"

# ---- Hatch build configuration ----------------------------------------------
[tool.hatch.version]
path = "esnfed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["esnfed"]

[tool.hatch.build.targets.sdist]
include = [
    "esnfed",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ---- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
