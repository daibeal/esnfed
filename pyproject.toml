[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esnfed"
dynamic = ["version"]
description = "Echo State Networks for Federated Learning: reservoirs, topologies and federated strategies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dairon Andres Benites Aldaz", email = "dairon.aldaz@gmail.com" },
]
keywords = [
    "echo state networks",
    "reservoir computing",
    "federated learning",
    "recurrent neural networks",
    "ensemble learning",
    "time series",
    "machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core runtime dependencies: the library itself only needs these two.
dependencies = [
    "numpy>=1.21",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Optional accelerators for the reservoir harvest: Numba JIT (small/medium
# reservoirs) and SciPy sparse reservoirs (large N). All have NumPy fallbacks.
fast = [
    "numba>=0.58",
    "scipy>=1.7",
]
# Everything needed to reproduce the experiments (figures, tables, CSVs).
experiments = [
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pyarrow>=10.0",
]
# Visualisation: plotly (default backend), matplotlib + seaborn, kaleido (static export).
viz = [
    "plotly>=5.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "kaleido",
]
# Interoperability with ReservoirPy (design reservoirs there, federate here).
reservoirpy = [
    "reservoirpy>=0.3",
]
# Integration with the Flower federated-learning framework.
flower = [
    "flwr>=1.7",
]
# Documentation site (MkDocs Material) + in-browser live demo (JupyterLite).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
    "mkdocs-minify-plugin>=0.7",
    "jupyterlite-core>=0.3",
    "jupyterlite-pyodide-kernel>=0.3",
    "jupyter-server>=2.0",
]
# Experimental FedResPrompt LLM orchestration (optional real-LLM backend).
llm = [
    "transformers>=4.30",
]
# Development tooling.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://daibeal.github.io/esnfed/"
Documentation = "https://daibeal.github.io/esnfed/"
Repository = "https://github.com/daibeal/esnfed"
Issues = "https://github.com/daibeal/esnfed/issues"
Changelog = "https://github.com/daibeal/esnfed/blob/main/CHANGELOG.md"
Playground = "https://daibeal.github.io/esnfed/playground.html"

# ---- Hatch build configuration ----------------------------------------------
[tool.hatch.version]
path = "esnfed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["esnfed"]

[tool.hatch.build.targets.sdist]
include = [
    "esnfed",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ---- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers/--strict-config turn typos in markers or config into errors
# instead of silently skipping the intent.
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a couple of seconds",
    "network: needs internet access (skipped by default in CI)",
]
# Warnings raised by esnfed itself are promoted to errors, so a test that
# triggers one has to acknowledge it with pytest.warns. Third-party deprecations
# (matplotlib/pyparsing) are noisy and out of our control, so they stay warnings.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
]

# ---- coverage ----------------------------------------------------------------
[tool.coverage.run]
source = ["esnfed"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "except ImportError",
]
show_missing = true
skip_covered = true

# ---- ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear (mutable defaults, shadowed loop vars, ...)
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplifications
    "NPY",  # numpy-specific rules
    "RUF",
]
ignore = [
    "E741",    # ambiguous variable names: `l` for a layer reads fine here
    "B008",    # function call in a default arg: used for np.linspace defaults
    "SIM108",  # ternaries are not always clearer than an if/else
    "C408",    # dict(...) kwargs are the idiomatic Plotly/Matplotlib style
    "RUF001",  # "ambiguous" unicode: Greek letters are deliberate in plot labels
    "RUF022",  # __all__ is grouped by role, not alphabetised
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack whole fixtures and ignore the parts a given case does not need,
# which reads better than indexing; short lambdas are fine in assertions.
"tests/*" = ["E501", "RUF059", "E731", "RUF012", "F841"]
"esnfed/__init__.py" = ["F401"]   # re-exports

[tool.ruff.lint.isort]
known-first-party = ["esnfed"]

# ---- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
files = ["esnfed"]
ignore_missing_imports = true      # numba/scipy/plotly/reservoirpy are optional
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The optional backends are duck-typed against third-party objects that may not
# be installed; type checking them adds noise without catching real bugs.
module = ["esnfed.interop", "esnfed.viz", "esnfed.llm_orchestration"]
check_untyped_defs = false
