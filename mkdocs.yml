site_name: esnfed
site_description: >-
  Echo State Networks for Federated Learning — a federated reservoir computing toolkit.
site_url: https://daibeal.github.io/esnfed/
repo_url: https://github.com/daibeal/esnfed
repo_name: daibeal/esnfed
copyright: Copyright &copy; 2026 Dairon Andrés Benites Aldaz — MIT License

theme:
  name: material
  icon:
    logo: material/sine-wave
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: table

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daibeal/esnfed
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/esnfed/

nav:
  - Home: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - User guide:
    - Echo State Networks: guide/esn.md
    - Reservoir topologies: guide/topologies.md
    - Datasets: guide/datasets.md
    - Federated strategies: guide/federated.md
    - Visualisation: guide/viz.md
    - Interoperability: guide/interop.md
  - Examples: examples.md
  - Tutorial (notebook): tutorial.ipynb
  - FedResPrompt: fedresprompt.md
  - API reference: api.md
