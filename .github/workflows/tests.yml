name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library promises numpy + networkx as its only runtime dependencies.
  # This job installs nothing else, so a stray import of scipy/matplotlib/numba
  # fails here rather than in a user's minimal environment.
  core:
    name: core deps (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  # Full matrix: optional accelerators and backends present, so the sparse /
  # Numba / plotting paths are actually exercised instead of skipped.
  extras:
    name: all extras (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,viz,dev]"
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest -q --cov=esnfed --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,viz]" ruff mypy
      # Lint rules only, deliberately not `ruff format --check`: the source is
      # hand-formatted (aligned continuations, compact numeric expressions) and
      # reformatting it would churn every file without improving anything.
      - name: Ruff
        run: ruff check esnfed tests
      - name: Mypy
        run: mypy esnfed

  build:
    name: build + install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Install the built wheel in a clean env and smoke-test it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl pytest
          # Run from a directory without the source tree, so the *installed*
          # package is what gets imported.
          cd /tmp && /tmp/venv/bin/python -c "
          import esnfed, numpy as np
          from esnfed import EchoStateNetwork, datasets, topologies, metrics
          u, y = datasets.narma10(600, rng=0)
          utr, ytr, ute, yte = datasets.split(u, y, 0.7)
          W = topologies.random_reservoir(100, density=0.1, rng=0)
          esn = EchoStateNetwork(1, 1, W, spectral_radius=0.9, washout=50, seed=0)
          esn.fit(utr, ytr)
          err = metrics.nrmse(yte[50:], esn.predict(ute)[50:])
          assert err < 0.8, err
          print('esnfed', esnfed.__version__, 'wheel smoke test OK, NRMSE =', round(err, 4))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
