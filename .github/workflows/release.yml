name: release

# Publishes to PyPI when a version tag is pushed:
#
#     git tag v1.7.0 && git push origin v1.7.0
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect), so no API token
# is stored in this repository. It requires a one-time setup on PyPI:
#
#   https://pypi.org/manage/project/esnfed/settings/publishing/
#     Owner:            daibeal
#     Repository name:  esnfed
#     Workflow name:    release.yml
#     Environment name: pypi
#
# Use the `testpypi` input of workflow_dispatch for a dry run against TestPyPI
# first (a version number can never be reused on PyPI, so a mistake is permanent).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Never publish something the test suite has not passed.
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,viz,dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint and type check
        run: |
          ruff check esnfed tests
          mypy esnfed
      - name: Check the tag matches esnfed.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import esnfed; print(esnfed.__version__)")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match esnfed.__version__ ($PKG)"
            exit 1
          fi

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to ${{ (github.event_name == 'workflow_dispatch' && inputs.testpypi) && 'TestPyPI' || 'PyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/esnfed/
    permissions:
      id-token: write        # required for Trusted Publishing; no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: "!(github.event_name == 'workflow_dispatch' && inputs.testpypi)"
        uses: pypa/gh-action-pypi-publish@release/v1
